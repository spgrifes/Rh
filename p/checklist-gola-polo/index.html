<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist diário — Gola polo SP Grifes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;overflow-anchor:none}
button{touch-action:manipulation;font-family:inherit}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f5f2;color:#111}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e6e3dc;padding:12px 14px 10px}
h1{margin:0;font-size:19px}
.sub{font-size:13px;color:#666;margin-top:2px}
.bar{height:8px;background:#ececec;border-radius:6px;margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .g{background:#1fa34a}.bar .r{background:#d93025}
.cnt{display:flex;gap:8px;margin-top:8px;font-size:13px;font-weight:600}
.cnt span{padding:4px 9px;border-radius:20px;background:#f0f0f0}
.cnt .g{background:#e3f6ea;color:#12783a}.cnt .r{background:#fde8e6;color:#b3261e}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.tabs button{border:2px solid #d8d5cd;background:#fff;border-radius:14px;padding:9px 4px;font-size:13px;font-weight:700;color:#333;line-height:1.25}
.tabs button b{display:block;font-size:20px}
.tabs button[data-k=ok].on{background:#1fa34a;border-color:#1fa34a}.tabs button[data-k=no].on{background:#d93025;border-color:#d93025}
.tabs button.on{background:#111;color:#fff;border-color:#111}
main{padding:12px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.08);border:3px solid transparent;padding:14px 12px 12px}
.card.ok{border-color:#1fa34a}.card.no{border-color:#d93025}.card.hide{display:none}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.top img{width:34%;max-width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#eee;flex:none}
.top .tx{flex:1;min-width:0}
.nm{font-size:24px;font-weight:800;margin:0 0 6px 2px}
.nm.sem{margin:0 0 10px 2px;display:flex;justify-content:space-between;align-items:center}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;align-items:center;justify-content:center}
#zoom img{max-width:100%;max-height:100%}#zoom.on{display:flex}
.st{display:none;align-self:flex-start;margin-left:2px;font-size:13px;font-weight:800;padding:5px 11px;border-radius:20px;color:#fff;display:none}
.card.ok .st{display:inline-block;background:#1fa34a}.card.no .st{display:inline-block;background:#d93025}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{border:0;border-radius:14px;padding:20px 6px;font-size:17px;font-weight:800;color:#fff}
.btns .yes{background:#1fa34a}.btns .nop{background:#d93025}
.card.ok .nop,.card.no .yes{opacity:.35}
.clr{display:none;margin:8px 0 0;border:0;background:none;color:#777;font-size:13px;text-decoration:underline;padding:4px}
.card.ok .clr,.card.no .clr{display:block}
.sum{margin:14px auto 120px;max-width:536px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.sum h2{margin:0 0 6px;font-size:17px}
.sum textarea{width:100%;min-height:170px;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;margin-top:10px}
.send{background:#1fa34a;color:#fff;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:800;margin-top:8px}
.send[disabled]{opacity:.4}
.copy{background:#111;color:#fff;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:8px}
.hint{font-size:12.5px;color:#777;margin-top:8px;line-height:1.4}
.empty{text-align:center;color:#777;padding:30px 10px}
.limpar{display:block;width:calc(100% - 24px);max-width:536px;margin:12px auto 0;border:0;border-radius:14px;background:#111;color:#fff;font-size:17px;font-weight:800;padding:17px 10px}
.limpar.conf{background:#d93025}
</style>
</head>

const ITENS = CFG.itens, total = ITENS.length;
const hoje = new Date(), dia = hoje.toISOString().slice(0,10);
const KEY = 'checklist-'+CFG.key+'-'+dia;
let estado = {}, filtro = 'falta', tmr = null;
try { estado = JSON.parse(localStorage.getItem(KEY)||'{}')||{}; } catch(e){ estado={}; }
const salvar=()=>{ try{localStorage.setItem(KEY,JSON.stringify(estado));}catch(e){} };
const dn=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
document.getElementById('data').textContent = dn[hoje.getDay()]+', '+hoje.toLocaleDateString('pt-BR');
const tabsEl=document.getElementById('tabs');
[['falta','Faltam marcar'],['ok','Tenho'],['no','Não tenho']].forEach(([k,t])=>{const b=document.createElement('button');b.innerHTML=t+'<b>0</b>';b.dataset.k=k;b.onclick=()=>{filtro=k;aplicar();window.scrollTo(0,0);};tabsEl.appendChild(b);});
const list=document.getElementById('list'), cards=[];
ITENS.forEach((nome,i)=>{
  const c=document.createElement('div'); c.className='card';
  const foto=(CFG.fotos||[])[i];
  c.innerHTML=(foto?'<div class="top"><img alt=""><div class="tx"><div class="nm"></div><span class="st"></span></div></div>':'<div class="nm sem"><span class="nt"></span><span class="st"></span></div>')+'<div class="btns"><button class="yes">✔ TENHO</button><button class="nop">✖ NÃO TENHO</button></div><button class="clr">limpar marcação</button>';
  if(foto){ const im=c.querySelector('.top img'); im.src=foto; im.onclick=()=>{document.getElementById('zimg').src=foto;document.getElementById('zoom').classList.add('on');}; c.querySelector('.nm').textContent=nome; } else { c.querySelector('.nt').textContent=nome; }
  c.querySelector('.yes').onclick=()=>marcar(i,'ok');
  c.querySelector('.nop').onclick=()=>marcar(i,'no');
  c.querySelector('.clr').onclick=()=>marcar(i,'');
  list.appendChild(c); cards.push(c);
});
function pintar(i){const c=cards[i],s=estado[i]||'';c.classList.toggle('ok',s==='ok');c.classList.toggle('no',s==='no');c.querySelector('.st').textContent=s==='ok'?'TEM':(s==='no'?'NÃO TEM':'');}
function marcar(i,s){ if(s)estado[i]=s; else delete estado[i]; salvar(); pintar(i); contar(); clearTimeout(tmr); tmr=setTimeout(aplicar,350); }
function faltam(){return ITENS.map((n,i)=>estado[i]==='no'?i:-1).filter(i=>i>=0);}
function contar(){
  let g=0,r=0; ITENS.forEach((_,i)=>{if(estado[i]==='ok')g++;else if(estado[i]==='no')r++;});
  document.getElementById('cg').textContent=g+' tenho';
  document.getElementById('cr').textContent=r+' não tenho';
  document.getElementById('cf').textContent=(total-g-r)+' faltam';
  const cnt={falta:total-g-r,ok:g,no:r};[...tabsEl.children].forEach(b=>{b.querySelector('b').textContent=cnt[b.dataset.k];});
  document.getElementById('bg').style.width=(g/total*100)+'%';
  document.getElementById('br').style.width=(r/total*100)+'%';
  const f=faltam(); let t='*Reposição de '+CFG.nome+' — '+hoje.toLocaleDateString('pt-BR')+'*\n\n';
  if(f.length){
    t+='Oi! '+CFG.frase+' ('+f.length+'):\n\n'+f.map((i,k)=>(k+1)+'. '+ITENS[i]).join('\n')+'\n\n';
    t+='Por favor, me retorne informando:\n\n1. Quais você TEM e já vai trazer\n\n2. Quais você NÃO TEM, para eu pedir ao fabricante\n\nDesde já, obrigada!';
  } else t+='Nada para repor até agora.';
  document.getElementById('txt').value=t;
  document.getElementById('qtd').textContent=f.length?(f.length+(f.length===1?' item para o CD trazer':' itens para o CD trazer')):'Nenhum item marcado como "não tenho".';
  document.getElementById('send').disabled=!f.length;
}
function aplicar(){
  [...tabsEl.children].forEach(b=>b.classList.toggle('on',b.dataset.k===filtro));
  let n=0; cards.forEach((c,i)=>{const s=estado[i]||'';const v=(filtro==='falta'&&!s)||(filtro==='ok'&&s==='ok')||(filtro==='no'&&s==='no');c.classList.toggle('hide',!v);if(v)n++;});
  const ve=document.getElementById('vazio'); ve.textContent={falta:'Tudo conferido. Veja as abas Tenho e Não tenho.',ok:'Nada marcado como Tenho.',no:'Nada marcado como Não tenho.'}[filtro]; ve.style.display=n?'none':'block';
}
document.getElementById('zoom').onclick=()=>document.getElementById('zoom').classList.remove('on');
document.getElementById('copy').onclick=async()=>{const ta=document.getElementById('txt'),h=document.getElementById('hint');try{await navigator.clipboard.writeText(ta.value);h.textContent='Resumo copiado. Cole no WhatsApp.';}catch(e){ta.removeAttribute('readonly');ta.focus();ta.select();h.textContent='Segure no texto, toque em Copiar e cole no WhatsApp.';}};
document.getElementById('send').onclick=()=>{ if(!faltam().length)return; location.href='https://wa.me/?text='+encodeURIComponent(document.getElementById('txt').value); };
const bl=[document.getElementById('limpar1'),document.getElementById('limpar2')], TXT='Limpar todos e contar de novo';
function rb(){bl.forEach(b=>{delete b.dataset.c;b.classList.remove('conf');b.textContent=TXT;});}
bl.forEach(b=>{b.onclick=()=>{ if(b.dataset.c){estado={};salvar();cards.forEach((_,i)=>pintar(i));contar();filtro='falta';aplicar();rb();window.scrollTo(0,0);} else{rb();b.dataset.c=1;b.classList.add('conf');b.textContent='Toque de novo para limpar tudo';setTimeout(()=>{if(b.dataset.c)rb();},4000);} };});
cards.forEach((_,i)=>pintar(i)); contar(); aplicar();
</script>
