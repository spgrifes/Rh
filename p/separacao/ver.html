<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu pedido foi separado — SP Grifes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#111}
header{background:#111;color:#d9b24c;text-align:center;padding:16px;font-weight:800;letter-spacing:1px}
main{max-width:560px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:6px 0 6px}
p{color:#444;line-height:1.5}
img{width:100%;border-radius:12px;margin:8px 0;display:block}
.nota{font-size:13px;color:#777;margin-top:18px}
</style>
</head>
<body>
<header>SP GRIFES</header>
<main id="m"><p>Carregando...</p></main>
<script>
var API = "https://cuiqmczhtcrrxafmzmhh.supabase.co/functions/v1/separacao-site";
var t = new URLSearchParams(location.search).get("t") || "";
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
fetch(API + "?a=publico&t=" + encodeURIComponent(t)).then(function(r){ return r.json(); }).then(function(j){
  var m = document.getElementById("m");
  if (!j.ok) { m.innerHTML = "<p>Não encontramos este pedido. O link pode estar incompleto.</p>"; return; }
  var h = "<h1>Olá, " + esc(j.cliente) + "!</h1><p>O pedido <b>#" + esc(j.pedido) + "</b> foi separado. Estas são as peças" + (j.retirada ? ", prontas para você retirar na loja." : ", que serão embaladas e enviadas.") + "</p>";
  j.fotos.forEach(function(u){ h += '<img loading="lazy" src="' + esc(u) + '" alt="Peças do pedido">'; });
  h += '<p class="nota">Mensagem automática da Eva, a robô da SP Grifes.</p>';
  m.innerHTML = h;
}).catch(function(){ document.getElementById("m").innerHTML = "<p>Não foi possível carregar agora. Tente de novo em instantes.</p>"; });
</script>
</body>
</html>
