<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="preconnect" href="https://cuiqmczhtcrrxafmzmhh.supabase.co" crossorigin>
<title>Separação de pedidos — SP Grifes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;touch-action:manipulation}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f5f2;color:#111;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
header small{display:block;color:#d9b24c;font-size:12px;margin-top:2px}
header button{background:none;border:1px solid #555;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;font-size:18px;padding:14px;border:2px solid #d8d5cd;border-radius:12px;background:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:#111;color:#fff;margin-top:14px}
.btn.gold{background:#d9b24c;color:#111}
.btn.green{background:#1fa34a}
.btn.ghost{background:#fff;color:#111;border:2px solid #111}
.btn[disabled]{opacity:.5}
.err{color:#b3261e;font-weight:600;margin-top:10px;font-size:15px}
.pedido{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px}
.pedido b{font-size:19px}
.pedido span.c{display:block;font-size:14px;color:#555;margin-top:2px}
.tag{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;background:#eee;color:#333}
.tag.novo{background:#111;color:#fff}.tag.separando{background:#fff3cd;color:#8a6500}
.tag.divergente,.tag.duvida{background:#fde8e6;color:#b3261e}.tag.conferindo{background:#e0ecff;color:#1d4ed8}
.tag.faltou{background:#ffe9c7;color:#9a4b00}.tag.ok,.tag.liberado,.tag.enviado{background:#e3f6ea;color:#12783a}
.atr{border:3px solid #e10600;border-radius:16px;background:#fff1f0;margin:0 0 16px;overflow:hidden}
.atr summary{list-style:none;cursor:pointer;padding:14px 16px;background:#e10600;color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.atr summary::-webkit-details-marker{display:none}
.atr summary .seta{transition:transform .2s}
.atr[open] summary .seta{transform:rotate(180deg)}
.atr .aviso-atr{padding:12px 16px;font-size:14px;color:#7a0000;font-weight:700;line-height:1.35}
.atr-item{background:#fff;border-left:6px solid #e10600;border-radius:12px;margin:0 12px 10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.atr-item b{font-size:18px}
.atr-item .c{display:block;font-size:14px;color:#555;margin-top:2px}
.atr-item .d{display:inline-block;margin-top:6px;background:#e10600;color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:800}
.atr-item .s{display:block;margin-top:6px;font-size:13px;color:#333}
h2{font-size:15px;margin:18px 2px 8px;color:#444;text-transform:uppercase;letter-spacing:.6px}
.item{padding:10px 0;border-bottom:1px solid #eee;font-size:16px}
.item:last-child{border:0}
.item b{font-size:17px}
.item .t{display:inline-block;background:#ffd93b;border-radius:8px;padding:2px 9px;font-weight:800;margin-right:6px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fotos div{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#ddd}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos button{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:16px}
.fotos .sub{opacity:.6}
.aviso{border-radius:14px;padding:14px;font-size:16px;line-height:1.4;margin-top:12px}
.aviso.ruim{background:#fde8e6;color:#7a1710}
.aviso.bom{background:#e3f6ea;color:#0d5c2b}
.aviso.info{background:#e0ecff;color:#1a3a8a}
.dica{font-size:14px;color:#555;line-height:1.45}
.bolinha{display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;margin-right:6px;vertical-align:middle;animation:pisca 1s infinite}
@keyframes pisca{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,163,74,.6)}50%{opacity:.35;box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.sep-oc{display:block;font-size:13px;font-weight:700;color:#16a34a;margin-top:3px}
.voltar{background:none;border:0;font-size:16px;font-weight:700;color:#111;padding:6px 0 12px}
.pedido.prio{border:3px solid #e10600;background:#fff1f0}
.pedido.prio.exc{border-color:#6d28d9;background:#f3eeff}
.prio-tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.5px;color:#fff;background:#e10600;border-radius:6px;padding:3px 8px;margin-bottom:5px}
.prio-tag.exc{background:#6d28d9}
.vazio{text-align:center;color:#777;padding:30px 10px}
.link{display:block;text-align:center;text-decoration:none;color:#111;font-weight:800;font-size:17px;border:2px solid #111;border-radius:14px;padding:14px;margin-top:10px;background:#fff}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:g 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes g{to{transform:rotate(360deg)}}
header .lg{height:42px;width:auto;display:block}header .tt{display:flex;align-items:center;gap:12px}header h1{font-size:17px}.hero{text-align:center;padding:6px 0 2px}.hero img{width:150px;height:auto;background:#111;border-radius:16px;padding:12px 16px}.hero p{margin:8px 0 0;color:#8a6500;font-weight:700;letter-spacing:.4px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="tt"><img class="lg" src="logo.png" alt="SP Grifes" width="68" height="42"><div><h1>Separação de pedidos</h1><small id="quem">Onde a moda acontece</small></div></div>
  <button id="sair" style="display:none">Sair</button>
</header>
<main id="app"></main>
<script>
var API = "https://cuiqmczhtcrrxafmzmhh.supabase.co/functions/v1/separacao-site";
var API2 = API.replace("separacao-site","separacao-lista");
var app = document.getElementById("app");
var TOKEN = "", NOME = "", PEDIDO = "", subindo = 0;

function guardar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function ler(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function limpar(){ try{ localStorage.removeItem("sep_token"); localStorage.removeItem("sep_nome"); }catch(e){} }
function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function chamar(acao, corpo, form){
  var opts = { method: "POST", headers: {} };
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (form) { opts.body = form; }
  else { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(corpo || {}); }
  var base = (acao==="lista"||acao==="detalhe"||acao==="faltou"||acao==="presenca"||acao==="sair") ? API2 : API;
  return fetch(base + "?a=" + acao, opts).then(function(r){
    return r.json().catch(function(){ return { ok:false, erro:"Resposta inesperada" }; }).then(function(j){
      if (r.status === 401 && j.erro === "sessao") { sairLogin(); }
      return j;
    });
  }).catch(function(){ return { ok:false, erro:"Sem internet. Tente de novo." }; });
}

function sairLogin(){ limpar(); try{ localStorage.removeItem("ret_lista"); }catch(e){} if (RET_AUTO) { clearInterval(RET_AUTO); RET_AUTO = null; } TOKEN = ""; NOME = ""; telaLogin(); }
document.getElementById("sair").onclick = function(){ if (confirm("Sair?")) sairLogin(); };

function cabecalho(){
  document.getElementById("quem").textContent = NOME ? ("Olá, " + NOME) : "Onde a moda acontece";
  document.getElementById("sair").style.display = NOME ? "" : "none";
}

/* ---------- login ---------- */
function telaLogin(){
  cabecalho();
  app.innerHTML = '<div class="hero"><img src="logo.png" alt="SP Grifes" width="150" height="93"><p>SEPARAÇÃO DE PEDIDOS</p></div><div class="card"><h2 style="margin-top:0">Entrar</h2>' +
    '<label for="n">Seu nome</label><input id="n" type="text" autocomplete="username" autocapitalize="words">' +
    '<label for="s">Sua senha</label><input id="s" type="password" autocomplete="current-password">' +
    '<div class="err" id="e"></div><button class="btn" id="go">Entrar</button></div>';
  var go = function(){
    var b = document.getElementById("go"); b.disabled = true; b.textContent = "Entrando...";
    chamar("login", { nome: document.getElementById("n").value, senha: document.getElementById("s").value }).then(function(j){
      if (!j.ok) { document.getElementById("e").textContent = j.erro || "Não foi possível entrar."; b.disabled = false; b.textContent = "Entrar"; return; }
      TOKEN = j.token; NOME = j.nome; guardar("sep_token", TOKEN); guardar("sep_nome", NOME); iniciar();
    });
  };
  document.getElementById("go").onclick = go;
  document.getElementById("s").onkeydown = function(e){ if (e.key === "Enter") go(); };
}

/* ---------- lista ---------- */
var ROTULO = { novo:"Novo", separando:"Separando", divergente:"Ajustar", duvida:"Ajustar", conferindo:"Conferindo", ok:"Conferido", liberado:"Conferido", enviado:"Concluído", faltou:"Faltou peça" };
function telaLista(){
  sairPedido(); PEDIDO = ""; cabecalho(); if (RET_AUTO) { clearInterval(RET_AUTO); RET_AUTO = null; } iniciarAuto();
  var c = ler("sep_lista");
  if (c) { try { pintarLista(JSON.parse(c)); } catch(e){ c = ""; } }
  if (!c) app.innerHTML = '<div class="vazio">Carregando pedidos...</div>';
  chamar("lista").then(function(j){
    if (!j.ok) { if (!c) { app.innerHTML = '<div class="card err">' + esc(j.erro || "Erro") + '</div><button class="btn" id="t">Tentar de novo</button>'; document.getElementById("t").onclick = telaLista; } return; }
    guardar("sep_lista", JSON.stringify(j));
    if (!PEDIDO) { ULT = JSON.stringify(j); pintarLista(j); }
  });
}
var ULT = "", AUTO = null, PRES = null, OCUP = null;
function iniciarAuto(){
  if (AUTO) clearInterval(AUTO);
  AUTO = setInterval(function(){
    if (PEDIDO || !TOKEN || document.hidden) return;
    chamar("lista").then(function(j){
      if (!j.ok || PEDIDO) return;
      var t = JSON.stringify(j); if (t === ULT) return;
      ULT = t; guardar("sep_lista", t); pintarLista(j);
    });
  }, 6000);
}
function sairPedido(){
  if (PRES) { clearInterval(PRES); PRES = null; }
  if (PEDIDO && TOKEN) { chamar("sair", { pedido: PEDIDO }); }
  OCUP = null;
}
window.addEventListener("pagehide", function(){
  if (PEDIDO && TOKEN) { try { navigator.sendBeacon(API2 + "?a=sair", new Blob([JSON.stringify({ pedido: PEDIDO, t: TOKEN })], { type: "text/plain" })); } catch(e){} }
});
function mostrarOcup(){
  var el = document.getElementById("ocup"); if (!el) return;
  el.innerHTML = OCUP ? '<div class="aviso info"><span class="bolinha"></span><b>' + esc(OCUP.nome) + '</b> está separando este pedido desde ' + esc(OCUP.desde || "") + '.</div>' : "";
}
function pintarLista(j){
  var h = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn gold" id="at" style="margin:0">Atualizar</button></div><button class="btn green" id="rt" style="margin:0 0 12px">Envia pra loja</button>';
  if (Array.isArray(j.atrasados) && j.atrasados.length) h += blocoAtrasados(j.atrasados);
  if (j.faltando && j.faltando.length) { h += '<h2>Faltou peça (' + j.faltando.length + ')</h2>'; j.faltando.forEach(function(p){ h += linha(p); }); }
  h += '<h2>Para separar (' + j.pendentes.length + ')</h2>';
  if (!j.pendentes.length) h += '<div class="vazio">Nenhum pedido esperando. Bom trabalho!</div>';
  j.pendentes.forEach(function(p){ h += linha(p); });
  if (j.concluidos.length) { h += '<h2>Separados recentes</h2>'; j.concluidos.forEach(function(p){ h += linha(p); }); }
  app.innerHTML = h;
  var dt = app.querySelector("details.atr"); if (dt) dt.addEventListener("toggle", function(){ window.ATR_AB = dt.open; });
  document.getElementById("at").onclick = function(){ this.textContent = "Atualizando..."; telaLista(); };
  document.getElementById("rt").onclick = telaRetirada;
  Array.prototype.forEach.call(app.querySelectorAll("[data-p]"), function(el){ el.onclick = function(){ telaPedido(el.getAttribute("data-p")); }; });
}
function blocoAtrasados(l){
  var h = '<details class="atr"' + (window.ATR_AB ? ' open' : '') + '><summary><span>🚨 ATRASADOS DE DIAS ATRÁS (' + l.length + ')</span><span class="seta">▼</span></summary>';
  h += '<div class="aviso-atr">NÃO SEPARAR DE NOVO! Estes pedidos são de dias atrás: a etiqueta já foi feita, mas o pacote ainda não foi postado nos Correios. Procure o pacote já separado e leve aos Correios hoje. Se não achar o pacote, avise a Nara.</div>';
  l.forEach(function(p){
    var a = p.alerta || {};
    h += '<div class="atr-item"><b>#' + esc(p.pedido) + '</b><span class="c">' + esc(p.cliente || "") + '</span>';
    h += '<span class="d">' + (p.compra ? 'Compra em <b>' + esc(p.compra) + '</b> · ' : '') + 'Etiqueta de ' + esc(a.etiqueta || "") + ' · há ' + esc(a.dias) + ' dias sem postar</span>';
    if (a.codigo) h += '<span class="s">Rastreio: <b style="font-size:14px">' + esc(a.codigo) + '</b></span>';
    if (!p.retirada) { var eu = API.replace("separacao-site","separacao-etiqueta") + '?p=' + encodeURIComponent(p.pedido) + '&t=' + encodeURIComponent(TOKEN); h += '<a class="btn gold" style="display:block;text-align:center;text-decoration:none;margin:8px 0" target="_blank" rel="noopener" href="' + eu + '">Imprimir etiqueta dos Correios</a>'; }
    h += '<span class="s">' + (a.separado ? 'Já separado' + (a.separou ? ' por ' + esc(a.separou) : '') + (a.separou_em ? ' em ' + esc(a.separou_em) : '') + ': é só achar o pacote.' : 'Sem registro de separação no Play: conferir na prateleira antes de separar.') + '</span></div>';
  });
  return h + '<div style="height:4px"></div></details>';
}
function linha(p){
  var oc = p.ocupado ? '<span class="sep-oc"><span class="bolinha"></span>' + (p.ocupado.eu ? 'Você está separando' : esc(p.ocupado.nome) + ' separando') + '</span>' : '';
  var pr = p.prioridade, ex = pr === "excursao" ? " exc" : "";
  var tg = pr ? '<span class="prio-tag' + ex + '">' + (pr === "retirada" ? "RETIRADA EM MÃOS · SEPARAR PRIMEIRO" : "EXCURSÃO · SEPARAR PRIMEIRO") + '</span><br>' : '';
  return '<button class="pedido' + (pr ? " prio" + ex : "") + '" data-p="' + esc(p.pedido) + '"><div>' + tg + '<b>#' + esc(p.pedido) + '</b><span class="c">' + esc(p.cliente || "") + (p.fotos ? ' · ' + p.fotos + ' foto(s)' : '') + '</span>' + (p.compra ? '<span class="c" style="display:block">Compra em ' + esc(p.compra) + '</span>' : '') + oc + '</div><span class="tag ' + esc(p.status) + '">' + esc(ROTULO[p.status] || p.status) + '</span></button>';
}

/* ---------- pedido ---------- */
var ITENS = null;
function bater(pedido){
  chamar("presenca", { pedido: pedido }).then(function(r){ if (PEDIDO !== pedido) return; OCUP = r && r.ocupado ? r.ocupado : null; mostrarOcup(); });
}
function telaPedido(pedido){
  if (PRES) { clearInterval(PRES); PRES = null; }
  PEDIDO = pedido; cabecalho(); OCUP = null;
  bater(pedido); PRES = setInterval(function(){ if (PEDIDO === pedido) bater(pedido); }, 20000);
  app.innerHTML = '<button class="voltar" id="v">← Voltar</button><div class="vazio">Abrindo o pedido #' + esc(pedido) + '...</div>';
  document.getElementById("v").onclick = telaLista;
  ITENS = fetch(API.replace("separacao-site","separacao-itens") + "?p=" + encodeURIComponent(pedido) + "&t=" + encodeURIComponent(TOKEN)).then(function(r){ return r.json(); }).catch(function(){ return {}; });
  chamar("detalhe", { pedido: pedido }).then(function(j){
    if (!j.ok) { app.innerHTML = '<button class="voltar" id="v">← Voltar</button><div class="card err">' + esc(j.erro || "Erro") + '</div>'; document.getElementById("v").onclick = telaLista; return; }
    if (j.itens && j.itens.length) { desenhar(j); return; }
    ITENS.then(function(x){ j.itens = x.itens || []; desenhar(j); });
  });
}
function desenhar(j){
  var fechado = (j.status === "enviado");
  var h = '<button class="voltar" id="v">← Voltar</button><div id="ocup"></div>';
  h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b style="font-size:22px">#' + esc(j.pedido) + '</b><div style="color:#555">' + esc(j.cliente) + '</div></div><span class="tag ' + esc(j.status) + '">' + esc(ROTULO[j.status] || j.status) + '</span></div>';
  if (j.retirada) h += '<div class="aviso info" style="margin-top:10px">Retirada na loja. Não tem etiqueta dos Correios.</div>';
  if (!j.retirada) {
    if (j.tem_etiqueta) { var eu = API.replace("separacao-site","separacao-etiqueta") + '?p=' + encodeURIComponent(j.pedido) + '&t=' + encodeURIComponent(TOKEN); h += '<a class="btn gold" style="display:block;text-align:center;text-decoration:none;margin-top:12px" target="_blank" rel="noopener" href="' + eu + '">Imprimir etiqueta dos Correios</a>'; }
    else h += '<div class="dica" style="margin-top:10px">A etiqueta ainda não está disponível.</div>';
  }
  h += '</div>';

  h += '<h2>O que separar</h2><div class="card">';
  (j.itens || []).forEach(function(i, n){ h += '<div class="item" style="display:flex;gap:12px;align-items:center"><div class="ft" data-n="' + n + '" style="width:96px;height:120px;flex:none;background:#f0eee9;border-radius:10px;overflow:hidden"></div><div><b>' + esc(i.produto) + '</b><br>' + esc(i.cor) + '<br><span class="t" style="font-size:22px;margin-top:6px">' + esc(i.tamanho) + '</span> Qtd: <b style="font-size:22px">' + i.qtd + '</b></div></div>'; });
  (function(){ var tot = 0; (j.itens || []).forEach(function(i){ tot += Number(i.qtd) || 0; }); if (tot) h += '<div class="item" style="text-align:center;font-size:20px;background:#fff7d6;border-radius:10px;padding:12px"><b>Total do pedido: ' + tot + (tot === 1 ? ' peça' : ' peças') + '</b></div>'; })();
  h += '</div>';

  if ((j.status === "divergente" || j.status === "duvida") && j.mensagem) h += '<div class="aviso ruim"><b>A Eva pede um ajuste:</b><br>' + esc(j.mensagem) + '<br><br>Corrija, tire as fotos novas (se precisar) e aperte Terminei de novo.</div>';
  if (j.status === "ok" || j.status === "liberado") h += '<div class="aviso bom"><b>Conferido pela Eva!</b><br>' + (j.aviso === "pendente" ? 'Falta só o aviso ao cliente, que será enviado assim que o WhatsApp estiver liberado.' : 'O cliente será avisado.') + '</div>';
  if (j.status === "enviado") h += '<div class="aviso bom"><b>Concluído.</b> O cliente já foi avisado com as fotos.</div>';
  if (j.status === "conferindo") h += '<div class="aviso info">A Eva está conferindo agora. Aguarde um instante e atualize.</div>';

  h += '<h2>Fotos das peças (' + (j.fotos || []).length + ')</h2><div class="card">';
  if (!fechado) h += '<div class="dica">Pedido grande? Fotografe um grupo de peças, retire e fotografe o próximo. Pode mandar quantas fotos precisar. Deixe a <b>etiqueta de tamanho aparecendo</b> e o fundo limpo (sem peças de outros pedidos nem documentos), pois a foto vai para o cliente.</div>';
  h += '<div class="fotos" id="grade">';
  (j.fotos || []).forEach(function(f){ h += '<div><img loading="lazy" src="' + esc(f.url) + '" alt="">' + (fechado ? '' : '<button data-d="' + f.id + '" aria-label="Apagar">✕</button>') + '</div>'; });
  h += '</div>';
  if (!fechado) {
    h += '<input id="arq" type="file" accept="image/*" multiple style="display:none">';
    h += '<button class="btn gold" id="add">Tirar / adicionar fotos</button>';
    h += '<div class="err" id="e"></div>';
  }
  h += '</div>';
  if (!fechado && j.status !== "conferindo") h += '<button class="btn green" id="fim"' + ((j.fotos || []).length ? '' : ' disabled') + '>Terminei de separar</button>';
  if (!fechado && j.status === "faltou") h += '<div class="aviso info"><b>Marcado: faltou peça.</b> Quando a peça chegar, tire as fotos e aperte Terminei.</div>';
  else if (!fechado && j.status !== "conferindo") h += '<button class="btn ghost" id="falta" style="border-color:#9a4b00;color:#9a4b00">Faltou peça</button>';
  app.innerHTML = h;
  document.getElementById("v").onclick = telaLista; mostrarOcup();
  ITENS.then(function(x){ (x.itens || []).forEach(function(it, n){ var el = app.querySelector('.ft[data-n="' + n + '"]'); if (el && it.foto) el.innerHTML = '<img src="' + esc(it.foto) + '" alt="" style="width:100%;height:100%;object-fit:contain">'; }); }).catch(function(){});
  Array.prototype.forEach.call(app.querySelectorAll("[data-d]"), function(b){ b.onclick = function(){ if (!confirm("Apagar esta foto?")) return; chamar("apagar_foto", { id: Number(b.getAttribute("data-d")) }).then(function(){ telaPedido(j.pedido); }); }; });
  if (!fechado) {
    document.getElementById("add").onclick = function(){ document.getElementById("arq").click(); };
    document.getElementById("arq").onchange = function(ev){ enviarFotos(j.pedido, ev.target.files); };
    var fim = document.getElementById("fim");
    if (fim) fim.onclick = function(){ if (j.status === "faltou") chamar("faltou", { pedido: j.pedido, desfazer: true }).then(function(){ terminar(j.pedido); }); else terminar(j.pedido); };
    var fl = document.getElementById("falta");
    if (fl) fl.onclick = function(){ if (!confirm("Marcar que faltou peça neste pedido?")) return; fl.disabled = true; chamar("faltou", { pedido: j.pedido }).then(function(){ guardar("sep_lista",""); telaLista(); }); };
  }
}

/* ---------- fotos: reduz no aparelho e envia uma por vez ---------- */
function reduzir(file){
  return new Promise(function(ok, falha){
    var fim = function(src, w, h, liberar){
      var m = 1280, e = Math.min(1, m / Math.max(w, h)), c = document.createElement("canvas");
      c.width = Math.round(w * e); c.height = Math.round(h * e);
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      if (liberar) liberar();
      c.toBlob(function(b){ b ? ok(b) : falha(new Error("foto")); }, "image/jpeg", 0.82);
    };
    if (window.createImageBitmap) {
      createImageBitmap(file, { imageOrientation: "from-image" }).then(function(bm){ fim(bm, bm.width, bm.height, function(){ if (bm.close) bm.close(); }); }).catch(porImg);
    } else porImg();
    function porImg(){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){ fim(im, im.naturalWidth, im.naturalHeight, function(){ URL.revokeObjectURL(url); }); };
      im.onerror = function(){ URL.revokeObjectURL(url); falha(new Error("foto")); };
      im.src = url;
    }
  });
}
function enviarFotos(pedido, files){
  if (!files || !files.length) return;
  var lista = Array.prototype.slice.call(files), i = 0, erros = 0;
  var btn = document.getElementById("add"), e = document.getElementById("e");
  btn.disabled = true;
  (function proxima(){
    if (i >= lista.length) { telaPedido(pedido); return; }
    btn.innerHTML = '<span class="spin"></span>Enviando foto ' + (i + 1) + ' de ' + lista.length + '...';
    reduzir(lista[i]).then(function(blob){
      var fd = new FormData(); fd.append("t", TOKEN); fd.append("pedido", pedido); fd.append("file", blob, "foto.jpg");
      return chamar("foto", null, fd);
    }).then(function(j){ if (!j || !j.ok) { erros++; e.textContent = (j && j.erro) || "Uma foto não foi enviada."; } }).catch(function(){ erros++; e.textContent = "Uma foto não foi enviada."; }).then(function(){ i++; proxima(); });
  })();
}

/* ---------- terminar: a Eva confere ---------- */
function terminar(pedido){
  var b = document.getElementById("fim"); b.disabled = true; b.innerHTML = '<span class="spin"></span>A Eva está conferindo...';
  chamar("terminar", { pedido: pedido }).then(function(j){
    if (!j.ok) { alert(j.erro || "Não deu certo. Tente de novo."); telaPedido(pedido); return; }
    telaPedido(pedido);
  });
}

/* ---------- acesso da LOJA: só pedidos de retirada (qualquer status) ---------- */
var API3 = API.replace("separacao-site","retirada-play");
function chamarR(acao, corpo){
  return fetch(API3 + "?a=" + acao, { method: "POST", headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(corpo || {}) })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, erro:"Resposta inesperada" }; }).then(function(j){ if (r.status === 401 && j.erro === "sessao") { sairLogin(); } return j; }); })
    .catch(function(){ return { ok:false, erro:"Sem internet. Tente de novo." }; });
}
function iniciar(){
  cabecalho();
  chamarR("eu").then(function(j){
    if (j && j.ok) PERFIL = j.perfil || "separacao"; if (j && j.ok && j.perfil === "retirada") telaRetirada(); else if (j && j.erro === "sessao") return; else telaLista();
  });
}
var RET_AUTO = null, PERFIL = "separacao";
function telaRetirada(){
  cabecalho();
  if (AUTO) { clearInterval(AUTO); AUTO = null; }
  if (RET_AUTO) clearInterval(RET_AUTO);
  RET_AUTO = setInterval(function(){ if (!document.hidden && TOKEN && !document.querySelector("button[disabled]")) carregarRet(true); }, 8000);
  var c = ler("ret_lista");
  if (c) { try { pintarRet(JSON.parse(c)); } catch(e){ c = ""; } }
  if (!c) app.innerHTML = '<div class="vazio">Carregando pedidos de retirada...</div>';
  carregarRet(false);
}
function carregarRet(silencio){
  chamarR("lista").then(function(j){
    if (!j.ok) { if (!silencio) app.innerHTML = '<div class="card err">' + esc(j.erro || "Erro") + '</div><button class="btn" id="t">Tentar de novo</button>'; var t = document.getElementById("t"); if (t) t.onclick = telaRetirada; return; }
    guardar("ret_lista", JSON.stringify(j)); pintarRet(j);
  });
}
function linhaRet(p, tipo){
  var st = p.status_site ? '<span class="c" style="display:block">Status no site: ' + esc(p.status_site) + '</span>' : '';
  var info = tipo === "pronto" && p.pronto_em ? '<span class="c" style="display:block">Pronto em ' + esc(p.pronto_em) + (p.pronto_por ? ' · ' + esc(p.pronto_por) : '') + '</span>' : (tipo === "entregue" && p.entregue_em ? '<span class="c" style="display:block">Entregue em ' + esc(p.entregue_em) + (p.entregue_por ? ' · ' + esc(p.entregue_por) : '') + '</span>' + (p.foto ? '<a class="c" style="display:block" target="_blank" href="' + esc(p.foto) + '">Ver foto da entrega</a>' : '') : '');
  var bt = '';
  if (tipo === "aguardando" && PERFIL !== "retirada") bt = '<button class="btn gold" data-r="pronto" data-p="' + esc(p.pedido) + '">Pronto para retirar</button>';
  if (tipo === "pronto" && PERFIL === "retirada") bt = '<button class="btn green" data-r="entregue" data-p="' + esc(p.pedido) + '">Entregue ao cliente (tirar foto)</button>';
  if (tipo === "entregue" && PERFIL === "retirada") bt = '<button class="btn ghost" style="font-size:14px;padding:10px" data-r="desfazer" data-p="' + esc(p.pedido) + '">Desfazer (voltar para pronto)</button>';
  var er = p.erro ? '<div class="err">' + esc(p.erro) + '</div>' : '';
  return '<div class="card" style="margin-bottom:10px"><b style="font-size:20px">#' + esc(p.pedido) + '</b>' + (p.pecas ? ' <span class="tag">' + esc(p.pecas) + ' peça(s)</span>' : '') + (tipo === "aguardando" ? (p.separado ? ' <span class="tag" style="background:#d6f0dc;color:#1b6b34">Já separado</span>' : ' <span class="tag" style="background:#fff3cd;color:#8a6500">Ainda separando</span>') : '') + '<span class="c" style="display:block;font-size:16px;margin-top:4px">' + esc(p.cliente || "") + '</span>' + (p.compra ? '<span class="c" style="display:block">Compra em ' + esc(p.compra) + '</span>' : '') + st + info + er + bt + '</div>';
}
function pintarRet(j){
  var h = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn gold" id="at" style="margin:0">Atualizar</button></div>';
  if (PERFIL !== "retirada") {
    h = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" id="vt" style="margin:0">Voltar</button><button class="btn gold" id="at" style="margin:0">Atualizar</button></div>';
    h += '<h2>Envia pra loja: marcar pronto para retirar (' + j.aguardando.length + ')</h2>';
    if (!j.aguardando.length) h += '<div class="vazio">Nenhum.</div>';
    j.aguardando.forEach(function(p){ h += linhaRet(p, "aguardando"); });
  }
  h += '<h2>Prontos para o cliente retirar (' + j.prontos.length + ')</h2>';
  if (!j.prontos.length) h += '<div class="vazio">Nenhum.</div>';
  j.prontos.forEach(function(p){ h += linhaRet(p, "pronto"); });
  if (j.entregues.length) { h += '<h2>Entregues hoje (' + j.entregues.length + ')</h2>'; j.entregues.forEach(function(p){ h += linhaRet(p, "entregue"); }); }
  app.innerHTML = h;
  document.getElementById("at").onclick = function(){ this.textContent = "Atualizando..."; carregarRet(false); };
  var vt = document.getElementById("vt"); if (vt) vt.onclick = telaLista;
  Array.prototype.forEach.call(app.querySelectorAll("button[data-r]"), function(b){
    b.onclick = function(){
      var acao = b.getAttribute("data-r"), ped = b.getAttribute("data-p");
      if (acao === "entregue") { tirarFoto(ped, b); return; }
      var msg = acao === "pronto" ? "Marcar o pedido " + ped + " como PRONTO para retirar? A loja vai passar a ver este pedido." : "Voltar o pedido " + ped + " para pronto?";
      if (!confirm(msg)) return;
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Atualizando no site...';
      chamarR(acao, { pedido: ped }).then(function(r){ if (!r.ok) alert(r.erro || "Não deu certo. Tente de novo."); carregarRet(false); });
    };
  });
}

/* foto da entrega: obrigatória para marcar "Entregue ao cliente" */
function tirarFoto(ped, b){
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment");
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    b.disabled = true; b.innerHTML = '<span class="spin"></span>Enviando foto...';
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      var m = 1280, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      chamarR("entregue", { pedido: ped, foto: c.toDataURL("image/jpeg", 0.7) }).then(function(r){ if (!r.ok) alert(r.erro || "Não deu certo. Tente de novo."); carregarRet(false); });
    };
    img.onerror = function(){ alert("Não consegui ler a foto. Tente de novo."); carregarRet(false); };
    img.src = url;
  };
  inp.click();
}

/* ---------- início ---------- */
TOKEN = ler("sep_token"); NOME = ler("sep_nome");
if (TOKEN) iniciar(); else telaLogin();
</script>
