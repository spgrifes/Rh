<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png">
<title>Play no pedido</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f5f2;color:#111}
header{background:#111;color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}header small{color:#d9b24c;font-size:12px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input{width:100%;font-size:18px;padding:14px;border:2px solid #d8d5cd;border-radius:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:#111;color:#fff;margin-top:14px}
.btn.gold{background:#d9b24c;color:#111}
.err{color:#b3261e;font-weight:600;margin-top:10px}.okm{color:#12783a;font-weight:700;margin-top:10px}
h2{font-size:15px;margin:18px 2px 8px;color:#444;text-transform:uppercase;letter-spacing:.6px}
.f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #eee;font-size:18px}
.f:last-child{border:0}
.f button{border:2px solid #111;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.f.off b{color:#999;text-decoration:line-through}
.dica{font-size:14px;color:#555;line-height:1.45}
.dia{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:8px;font-size:17px;text-align:left}.dia b{text-transform:capitalize}.dia small{color:#555;display:block;font-size:13px;margin-top:2px}.pd{background:#fff;border-radius:12px;padding:12px 14px;margin:0 0 8px 8px;font-size:15px;line-height:1.5;border-left:4px solid #d9b24c}.pd.f{border-left-color:#9a4b00}.pd em{color:#555;font-style:normal}.at{padding:10px 0;border-bottom:1px solid #eee;font-size:15px}
header .lg{height:42px;width:auto;display:block}header .tt{display:flex;align-items:center;gap:12px}header h1{font-size:17px}.hero{text-align:center;padding:6px 0 2px}.hero img{width:150px;height:auto;background:#111;border-radius:16px;padding:12px 16px}.hero p{margin:8px 0 0;color:#8a6500;font-weight:700;letter-spacing:.4px;font-size:13px}
</style>
</head>
<body>
<header class="tt"><img class="lg" src="logo.png" alt="SP Grifes" width="68" height="42"><div><h1>Play no pedido</h1><small>Página só do Fábio · SP Grifes</small></div></header>
<main id="app"></main>
<script>
var API = "https://cuiqmczhtcrrxafmzmhh.supabase.co/functions/v1/separacao-site";
var API2 = API.replace("separacao-site","separacao-lista");
var API4 = API.replace("separacao-site","sep-setor"), PERFIS = {};
var app = document.getElementById("app"), ADM = "";
function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function chamar(acao, corpo){
  corpo = corpo || {}; corpo.admin = ADM;
  return fetch((acao === "admin_dias" || acao === "admin_dia" ? API2 : (acao === "admin_perfis" || acao === "admin_setor") ? API4 : API) + "?a=" + acao, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(corpo) })
    .then(function(r){ return r.json(); }).catch(function(){ return { ok:false, erro:"Sem internet." }; });
}
function entrar(){
  app.innerHTML = '<div class="card"><label for="a">Senha de sempre</label><input id="a" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="btn" id="go">Entrar</button></div>';
  var go = function(){ ADM = document.getElementById("a").value; chamar("admin_listar").then(function(j){ if (!j.ok) { document.getElementById("e").textContent = j.erro || "Erro"; ADM = ""; return; } recarregar(); }); };
  document.getElementById("go").onclick = go;
  document.getElementById("a").onkeydown = function(e){ if (e.key === "Enter") go(); };
}
function recarregar(msg){ Promise.all([chamar("admin_listar"), chamar("admin_perfis")]).then(function(r){ PERFIS = (r[1] && r[1].perfis) || {}; tela(r[0], msg); }); }
var SETOR = { separacao:"Separação", retirada:"Loja (retirada)" };
function tela(j, msg){
  var h = '<div class="card"><h2 style="margin-top:0">Cadastrar ou trocar senha</h2><div class="dica">Digite o nome da funcionária e a senha dela. Para editar, toque em "Editar" ao lado do nome: troque o setor e/ou a senha (senha vazia = mantém). Use uma senha curta e fácil.</div>' +
    '<label for="n">Nome</label><input id="n" type="text" autocapitalize="words">' +
    '<label for="st">Setor</label><select id="st" style="width:100%;font-size:18px;padding:14px;border:2px solid #d8d5cd;border-radius:12px;background:#fff"><option value="separacao">Separação (vê todos os pedidos)</option><option value="retirada">Loja (só pedidos de retirada)</option></select>' +
    '<label for="s">Senha</label><input id="s" type="text" autocomplete="off">' +
    '<button class="btn gold" id="salvar">Salvar</button>' + (msg ? '<div class="' + (msg.ok ? 'okm' : 'err') + '">' + esc(msg.t) + '</div>' : '') + '</div>';
  h += '<h2>Funcionárias (' + j.funcionarias.length + ')</h2><div class="card">';
  if (!j.funcionarias.length) h += '<div class="dica">Ninguém cadastrado ainda.</div>';
  j.funcionarias.forEach(function(f){ h += '<div class="f' + (f.ativa ? '' : ' off') + '"><b>' + esc(f.nome) + '</b><span class="dica" style="margin:0 8px">' + esc(SETOR[PERFIS[f.id] || "separacao"] || "") + '</span><button data-ed="' + esc(f.nome) + '" data-pf="' + esc(PERFIS[f.id] || "separacao") + '">Editar</button><button data-id="' + f.id + '" data-a="' + (f.ativa ? 0 : 1) + '">' + (f.ativa ? 'Desativar' : 'Reativar') + '</button></div>'; });
  h += '</div>';
  if (j.atencao.length) { h += '<h2>Pedidos que precisam de atenção</h2><div class="card">'; j.atencao.forEach(function(p){ h += '<div class="at"><b>#' + esc(p.pedido) + '</b> ' + esc(p.cliente_nome || "") + '<br>' + esc(p.status) + (p.funcionaria ? ' · ' + esc(p.funcionaria) : '') + (p.aviso_erro ? '<br><span style="color:#b3261e">' + esc(p.aviso_erro) + '</span>' : '') + '</div>'; }); h += '</div>'; }
  h += '<button class="btn" id="hist">Histórico dos pedidos separados</button>';
  app.innerHTML = h;
  document.getElementById("hist").onclick = historico;
  document.getElementById("salvar").onclick = function(){
    var nome = document.getElementById("n").value, senha = document.getElementById("s").value, setor = document.getElementById("st").value;
    var passo = senha ? chamar("admin_salvar", { nome: nome, senha: senha }) : Promise.resolve({ ok: !!nome, erro: "Digite o nome." });
    passo.then(function(r){
      if (!r.ok) { recarregar({ ok:false, t:r.erro || "Erro" }); return; }
      chamar("admin_setor", { nome: nome, perfil: setor }).then(function(q){ recarregar(q.ok ? { ok:true, t:"Salvo! " + nome + " já pode entrar (setor: " + SETOR[setor] + ")." } : { ok:false, t:q.erro || "Erro ao gravar o setor" }); });
    });
  };
  Array.prototype.forEach.call(app.querySelectorAll("[data-ed]"), function(b){
    b.onclick = function(){ document.getElementById("n").value = b.getAttribute("data-ed"); document.getElementById("st").value = b.getAttribute("data-pf"); document.getElementById("s").value = ""; document.getElementById("s").placeholder = "deixe vazio para manter a senha"; window.scrollTo(0, 0); document.getElementById("s").focus(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-id]"), function(b){
    b.onclick = function(){ chamar("admin_ativar", { id: Number(b.getAttribute("data-id")), ativa: b.getAttribute("data-a") === "1" }).then(function(){ recarregar(); }); };
  });
}
var ROT = { enviado:"Separado", ok:"Separado", liberado:"Separado", faltou:"Faltou peça", separando:"Separando", conferindo:"Conferindo", divergente:"Ajustar", duvida:"Ajustar" };
function nomeDia(d){ var x = new Date(d + "T12:00:00"); return x.toLocaleDateString("pt-BR", { weekday:"long", day:"2-digit", month:"2-digit" }); }
function historico(){
  app.innerHTML = '<button class="btn" id="vt" style="margin:0 0 12px;background:#fff;color:#111;border:2px solid #111">← Voltar</button><h2 style="margin-top:0">Histórico (toque no dia)</h2><div id="dias" class="dica">Carregando...</div>';
  document.getElementById("vt").onclick = function(){ recarregar(); };
  chamar("admin_dias").then(function(j){
    var el = document.getElementById("dias");
    if (!j.ok || !j.dias.length) { el.textContent = "Ainda não tem nada no histórico."; return; }
    var h = "";
    j.dias.forEach(function(d){ h += '<div data-d="' + d.dia + '"><button class="dia"><span><b>' + esc(nomeDia(d.dia)) + '</b><small>' + d.separados + ' separados' + (d.faltou ? ' · ' + d.faltou + ' faltou peça' : '') + (d.andando ? ' · ' + d.andando + ' em andamento' : '') + '</small></span><span>▾</span></button><div class="lista"></div></div>'; });
    el.className = ""; el.innerHTML = h;
    Array.prototype.forEach.call(el.querySelectorAll("[data-d]"), function(box){
      var lista = box.querySelector(".lista"), btn = box.querySelector("button"), aberto = false, carregado = false;
      btn.onclick = function(){
        aberto = !aberto; lista.style.display = aberto ? "" : "none";
        if (!aberto || carregado) return;
        lista.innerHTML = '<div class="dica" style="margin:0 0 8px 8px">Carregando...</div>';
        chamar("admin_dia", { dia: box.getAttribute("data-d") }).then(function(r){
          carregado = true;
          if (!r.ok) { lista.innerHTML = '<div class="err">' + esc(r.erro || "Erro") + '</div>'; return; }
          var t = "";
          r.pedidos.forEach(function(p){
            t += '<div class="pd' + (p.status === "faltou" ? ' f' : '') + '"><b>#' + esc(p.pedido) + '</b> ' + esc(p.cliente || "") + ' — <b>' + esc(ROT[p.status] || p.status) + '</b><br>' +
              '<em>Pegou:</em> ' + esc(p.pegou || "—") + (p.pegou_hora ? ' às ' + esc(p.pegou_hora) : '') + '<br>' +
              '<em>Terminou:</em> ' + (p.terminou ? esc(p.terminou) + ' às ' + esc(p.terminou_hora) : 'ainda não') + '<br>' +
              '<em>Fotos:</em> ' + p.fotos + (p.tentativas > 1 ? ' · ' + p.tentativas + ' conferências' : '') +
              (p.eva ? '<br><em>Eva:</em> ' + esc(p.eva) : '') + '</div>';
          });
          lista.innerHTML = t || '<div class="dica" style="margin:0 0 8px 8px">Nada neste dia.</div>';
        });
      };
    });
  });
}
entrar();
</script>
</body>
</html>
