<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Checklists diários — SP Grifes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f2ec;color:#111}
header{padding:22px 16px 10px;max-width:560px;margin:0 auto}
h1{margin:0;font-size:22px}
.sub{color:#666;font-size:14px;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:10px 12px 40px;display:grid;gap:12px}
a.item{display:block;background:#fff;border-radius:16px;padding:20px 18px;text-decoration:none;color:#111;box-shadow:0 1px 6px rgba(0,0,0,.08);border:2px solid #111}
a.item b{display:block;font-size:19px}
a.item span{display:block;color:#666;font-size:14px;margin-top:4px}
.soon{background:#ecebe5;border-radius:16px;padding:20px 18px;color:#888;border:2px dashed #cfcdc4}
.soon b{display:block;font-size:19px}
.soon span{display:block;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Checklists diários</h1>
  <div class="sub">Escolha o produto que vai conferir hoje.</div>
</header>
<main>
  <a class="item" href="../checklist-polos/"><b>Polo chinesa</b><span>Conferir peça por peça, com foto</span></a>
  <div class="soon"><b>Calça</b><span>Em breve</span></div>
</main>
</body>
</html>
