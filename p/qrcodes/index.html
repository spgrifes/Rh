<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060d">
<meta name="robots" content="noindex,nofollow">
<title>SP Grifes — QR Codes</title>
<style>
    @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  :root{--vermelho:#e11d26;--ease:cubic-bezier(.2,.8,.2,1);--raio:clamp(22px,3.4vw,44px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  html,body{height:100%;margin:0;overflow:hidden;background:#05060d;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    touch-action:manipulation;overscroll-behavior:none}
  .nebulosa{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(55vmax 38vmax at 12% 8%, rgba(225,29,38,.20), transparent 62%),
      radial-gradient(60vmax 42vmax at 92% 92%, rgba(60,80,200,.20), transparent 62%),
      radial-gradient(40vmax 30vmax at 60% 40%, rgba(120,60,180,.10), transparent 65%),
      linear-gradient(180deg,#04050b 0%, #090b17 55%, #05060d 100%);
    animation:respira 14s ease-in-out infinite alternate}
  @keyframes respira{from{filter:brightness(.92)}to{filter:brightness(1.12)}}
  #fundo,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #fx{z-index:2}
  main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 1.6vh) 3vw calc(env(safe-area-inset-bottom) + 2vh)}
  header{display:flex;align-items:center;justify-content:center;height:17vh}
  .logo{height:15vh;width:auto;display:block;filter:drop-shadow(0 0 2.2vh rgba(225,29,38,.55));opacity:0}
  .grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2.6vw;align-items:center;justify-items:center}
  .botao{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
    width:100%;display:flex;flex-direction:column;align-items:center;gap:2.2vh;opacity:0;transform:translateY(40px) scale(.96)}
  .cena{perspective:1600px;width:min(27vw,54vh);aspect-ratio:1/1;position:relative}
  .cena::before{content:"";position:absolute;inset:-6px;border-radius:calc(var(--raio) + 6px);z-index:0;
    background:conic-gradient(from var(--ang),rgba(225,29,38,0) 0 55%,rgba(225,29,38,.55) 72%,#ff3b44 88%,#fff 97%,rgba(225,29,38,0) 100%);
    filter:drop-shadow(0 0 12px rgba(225,29,38,.85));animation:luz 3.6s linear infinite}
  .cena::after{content:"";position:absolute;inset:-2px;border-radius:calc(var(--raio) + 2px);z-index:0;
    box-shadow:0 0 3.4vh rgba(225,29,38,.28);animation:pulsa 5s ease-in-out infinite alternate}
  .botao:nth-child(2) .cena::before{animation-delay:-1.2s}
  .botao:nth-child(3) .cena::before{animation-delay:-2.4s}
  @keyframes luz{to{--ang:360deg}}
  @keyframes pulsa{from{opacity:.45}to{opacity:1}}
  .virador{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;z-index:1}
  .face{position:absolute;inset:0;border-radius:var(--raio);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .frente{background:#fff;box-shadow:0 2.4vh 6vh rgba(0,0,0,.55);padding:6%;transform:rotateY(180deg)}
  .frente svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .costas{box-shadow:0 2.4vh 6vh rgba(0,0,0,.55)}
  .costas svg{width:52%;height:52%;display:block}
  .wa .costas{background:linear-gradient(145deg,#2be077,#128c4a)}
  .go .costas{background:#fff}
  .ig .costas{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .costas::after,.frente::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 65%);transform:translateX(-120%)}
  .brilha .frente::after,.brilha .costas::after{animation:passa 1.1s var(--ease)}
  @keyframes passa{to{transform:translateX(120%)}}
  .rotulo{font-weight:900;text-align:center;line-height:1.05;font-size:clamp(20px,4.4vh,46px);letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .rotulo small{display:block;margin-top:.6vh;font-weight:600;font-size:.52em;color:#b9bfd6;letter-spacing:.04em}
  .wa .rotulo{color:#46e88a}.go .rotulo{color:#9bbcff}.ig .rotulo{color:#ff7ccb}
  .botao:active .cena{transform:scale(.985);transition:transform .08s}
  @media (prefers-reduced-motion:reduce){.brilha .frente::after,.brilha .costas::after,.cena::before{animation:none}}
  @media (max-aspect-ratio:1/1){.grade{grid-template-columns:1fr;gap:3vh}.cena{width:min(70vw,24vh)}}
</style>
</head>

<script src="gsap.min.js"></script>
<script src="bg.min.js"></script>
<script src="fx.min.js"></script>
<script>
(function(){
  try { Fundo.iniciarFundo(document.getElementById('fundo')); } catch(e) {}
  try { Fx.iniciarFx(document.getElementById('fx')); } catch(e) {}

  var BOTOES = Array.prototype.slice.call(document.querySelectorAll('.botao'));
  var QR_FICA_MS   = 2 * 60 * 1000;      // depois do toque, o QR Code fica 2 minutos antes de voltar ao símbolo
  var GIRADINHA_MS = 2.5 * 60 * 1000;    // de 2min30 em 2min30 os símbolos dão uma giradinha sozinhos

  gsap.to('.logo', {opacity:1, duration:1.2, ease:'power2.out'});
  gsap.to(BOTOES, {opacity:1, y:0, scale:1, duration:.9, ease:'back.out(1.4)', stagger:.14, delay:.2});

  var cartoes = BOTOES.map(function(b, i){
    var c = { b:b, v:b.querySelector('.virador'), mostraQR:false, rot:0, girando:false, timer:null };
    gsap.to(b.querySelector('.cena'), {y:-6, duration:2.4+i*.3, ease:'sine.inOut', yoyo:true, repeat:-1, delay:1+i*.2});
    return c;
  });

  function brilho(c){ c.b.classList.remove('brilha'); void c.b.offsetWidth; c.b.classList.add('brilha'); }

  // Gira meia-volta: símbolo <-> QR Code
  function virar(c){
    if (c.girando) return;
    c.girando = true; clearTimeout(c.timer);
    c.mostraQR = !c.mostraQR; c.rot += 180;
    brilho(c);
    var tl = gsap.timeline({onComplete:function(){ c.girando = false; }});
    tl.to(c.v, {z:120, scale:1.05, duration:.22, ease:'power2.out'}, 0);
    tl.to(c.v, {rotationY:c.rot, duration:.95, ease:'elastic.out(1,0.7)'}, 0);
    tl.to(c.v, {z:0, scale:1, duration:.5, ease:'power3.inOut'}, .3);
    if (c.mostraQR) c.timer = setTimeout(function(){ if (c.mostraQR) virar(c); }, QR_FICA_MS);
  }

  // Giradinha de chamar atenção: volta inteira e termina no mesmo símbolo
  function giradinha(c){
    if (c.girando || c.mostraQR) return;
    c.girando = true; c.rot += 360; brilho(c);
    gsap.timeline({onComplete:function(){ c.girando = false; }})
      .to(c.v, {z:90, duration:.3, ease:'power2.out'}, 0)
      .to(c.v, {rotationY:c.rot, duration:1.3, ease:'power3.inOut'}, 0)
      .to(c.v, {z:0, duration:.5, ease:'power3.inOut'}, .8);
  }
  function giradinhaEmOnda(){
    cartoes.forEach(function(c, i){ setTimeout(function(){ giradinha(c); }, i * 280); });
  }
  setTimeout(giradinhaEmOnda, 12000);
  setInterval(giradinhaEmOnda, GIRADINHA_MS);

  cartoes.forEach(function(c){ c.b.addEventListener('click', function(){ virar(c); }); });

  // Mantém a tela acesa
  function acordar(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); } catch(e){} }
  acordar();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) acordar(); });
  document.addEventListener('click', function once(){ acordar(); document.removeEventListener('click', once); });
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }); });
})();
</script>
