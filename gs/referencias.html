tion><i style="background:#7a5c2e">E</i><b>Eradys F.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Amo a loja, super recomendo. Pode comprar sem medo: produtos de ótima qualidade.”</blockquote><figcaption><i style="background:#444">R</i><b>Regiane B.</b><small>Google · nov 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Andei o shopping inteiro e não achei nada. A Karol achou tudo. Melhor atendimento da vida!”</blockquote><figcaption><i style="background:#c9a55c">D</i><b>Dyego V.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Peças de alta qualidade. Não tem como ir e não comprar mais de 6, uma mais top que a outra.”</blockquote><figcaption><i style="background:#2d6a4f">E</i><b>Erick R.</b><small>Google · nov 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Loja muito boa, com grande variedade de marcas de qualidade. A Carol foi sensacional.”</blockquote><figcaption><i style="background:#3a5a9b">G</i><b>Gustavo A.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Roupas top, atendimento top. Sou cliente e super indico. Parem de procurar!”</blockquote><figcaption><i style="background:#9b3a5a">J</i><b>Johannes S.</b><small>Google · nov 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Muito atenciosa o tempo todo, perguntando se eu precisava de ajuda e mostrando modelos novos.”</blockquote><figcaption><i style="background:#7a5c2e">V</i><b>Victor B.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Qualidade dos produtos muito boa, atendentes atenciosos, camisas e camisetas de alta qualidade.”</blockquote><figcaption><i style="background:#444">A</i><b>Alessandro P.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“Equipe sensacional, roupas maravilhosas. Exemplo de profissionalismo.”</blockquote><figcaption><i style="background:#c9a55c">J</i><b>John E.</b><small>Google · out 2026</small></figcaption></figure><figure><div class="st">★★★★★</div><blockquote>“A Karol é ótima profissional, com muita qualidade no atendimento, prestativa e atenciosa.”</blockquote><figcaption><i style="background:#2d6a4f">G</i><b>Gabriel A.</b><small>Google · nov 2026</small></figcaption></figure></div><div class="ct"><a class="b g" href="https://maps.google.com/maps?cid=17213522362754495172" target="_blank" rel="noopener">Ver todas no Google</a><a class="b o" href="https://www.spgrifes.com.br/?utm_source=site-google&utm_medium=referencias" target="_blank" rel="noopener">Ver na loja online</a></div></div><script>function fit(){var w=document.getElementById('w');w.style.zoom=1;var h=innerHeight,s=w.scrollHeight;if(s>h+2)w.style.zoom=(h/s).toFixed(3)}addEventListener('load',fit);addEventListener('resize',fit);setTimeout(fit,300);setTimeout(fit,1500)</script><script>var r=document.querySelector('.rl');setInterval(function(){if(r.scrollLeft+r.clientWidth>=r.scrollWidth-5)r.scrollTo({left:0,behavior:'smooth'});else r.scrollBy({left:284,behavior:'smooth'})},3500)</script></body></html>
